name: Deploy JFTSE Item Finder

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html style.css favicon.ico script.js _site/
          cp -R assets _site/assets

      - name: Download shop snapshots
        run: |
          mkdir _site/shop
          for page in {0..19}; do
            curl --fail --silent --show-error \
              "https://jftse.com/jftse-restservice/api/shop?size=1000&page=${page}" \
              --output "_site/shop/${page}.json"
            jq empty "_site/shop/${page}.json"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
